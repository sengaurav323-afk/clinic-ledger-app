<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Clinic Ledger</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background: #F5F7FA; color: #1A2332; font-family: 'Source Sans 3', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #fff; border: 1px solid #E2E6ED; border-radius: 14px; padding: 36px; max-width: 400px; width: 100%; box-shadow: 0 1px 3px rgba(16,27,51,0.08); text-align: center; }
  .icon { width: 56px; height: 56px; border-radius: 50%; background: #EAF0FF; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; margin: 0 0 6px; }
  p { color: #6B7280; font-size: 14px; margin: 0 0 20px; }
  label { display: block; text-align: left; font-size: 12px; color: #6B7280; margin-bottom: 4px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid #E2E6ED; border-radius: 8px; font-size: 15px; margin-bottom: 14px; }
  button { width: 100%; background: #2E5BFF; color: #fff; border: none; border-radius: 8px; padding: 13px 0; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { font-size: 13px; margin-top: 14px; min-height: 18px; }
  .msg.error { color: #9C3B2E; }
  .msg.ok { color: #2F5233; }
  a { color: #2E5BFF; text-decoration: underline; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.8 2.3 5 6 5c2 0 3.3 1 4 2 0.7-1 2-2 4-2 3.7 0 5.3 3.8 3.5 7.5C19 16.65 12 21 12 21z" fill="#2E5BFF"/></svg></div>
    <h1 id="heading">Reset your password</h1>
    <p id="subtext">Checking your reset link…</p>
    <form id="resetForm" style="display:none">
      <label>New password</label>
      <input type="password" id="newPw" minlength="6" required placeholder="At least 6 characters" />
      <label>Confirm new password</label>
      <input type="password" id="confirmPw" minlength="6" required placeholder="Re-enter password" />
      <button type="submit">Reset password</button>
    </form>
    <div id="successBox" style="display:none">
      <a href="/">← Back to sign in</a>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjzfzvCXPCifxeG01QRJH6jT3Yh0VxFJk",
      authDomain: "curevona.firebaseapp.com",
      projectId: "curevona",
      storageBucket: "curevona.firebasestorage.app",
      messagingSenderId: "56185108381",
      appId: "1:56185108381:web:5563db3ef9573035762174",
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get("oobCode");
    const heading = document.getElementById("heading");
    const subtext = document.getElementById("subtext");
    const form = document.getElementById("resetForm");
    const msg = document.getElementById("msg");
    const successBox = document.getElementById("successBox");

    if (!oobCode) {
      heading.textContent = "You're all set";
      subtext.textContent = "If you just reset your password, it's saved — sign in below with your new password. If you're looking to reset a password, go back and request a new link from the sign-in page.";
      successBox.style.display = "block";
    } else {
      verifyPasswordResetCode(auth, oobCode).then((email) => {
        subtext.textContent = `Set a new password for ${email}`;
        form.style.display = "block";
      }).catch(() => {
        heading.textContent = "Link expired or invalid";
        subtext.textContent = "This reset link is no longer valid. Please request a new one from the sign-in page.";
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPw = document.getElementById("newPw").value;
      const confirmPw = document.getElementById("confirmPw").value;
      msg.textContent = "";
      msg.className = "msg";
      if (newPw.length < 6) { msg.textContent = "Password must be at least 6 characters."; msg.className = "msg error"; return; }
      if (newPw !== confirmPw) { msg.textContent = "Passwords don't match."; msg.className = "msg error"; return; }
      try {
        await confirmPasswordReset(auth, oobCode, newPw);
        form.style.display = "none";
        heading.textContent = "Password reset!";
        subtext.textContent = "Your password has been changed successfully.";
        successBox.style.display = "block";
      } catch (err) {
        msg.textContent = "Could not reset password — the link may have expired. Please request a new one.";
        msg.className = "msg error";
      }
    });
  </script>
</body>
</html>
