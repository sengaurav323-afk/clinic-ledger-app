<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Reset Password — Curevona</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap');
  :root {
    --navy: #0d1b3d;
    --blue: #2E5BFF;
    --text: #1a2332;
    --muted: #6b7280;
    --bg: #f5f7fa;
    --error: #b3261e;
    --error-bg: #fdecea;
    --ok: #1e7a3e;
    --ok-bg: #e9f7ef;
    --warn: #b45309;
    --border: #e2e6ed;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy) 38%, var(--bg) 38%, var(--bg) 100%);
    color: var(--text);
    font-family: 'Source Sans 3', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top, 0px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(13, 27, 61, 0.18);
    text-align: center;
  }
  .logo-badge {
    width: 60px;
    height: 60px;
    border-radius: 16px;
    background: #eaf0ff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
  }
  .logo-badge img { width: 36px; height: 36px; object-fit: contain; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    margin: 0 0 8px;
    color: var(--navy);
  }
  .subtext { color: var(--muted); font-size: 14.5px; margin: 0 0 28px; line-height: 1.5; }
  .field { text-align: left; margin-bottom: 18px; }
  label { display: block; font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  label .req { color: var(--error); }
  .input-wrap { position: relative; }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 12px 46px 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    transition: border-color 0.15s;
    background: #fff;
    color: var(--text);
  }
  input:focus { outline: none; border-color: var(--blue); }
  input.invalid { border-color: var(--error); }
  input.valid { border-color: var(--ok); }
  .toggle-visibility {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 8px;
    width: auto;
    display: flex;
    align-items: center;
  }
  .toggle-visibility:hover { color: var(--blue); }
  .toggle-visibility svg { width: 19px; height: 19px; }
  .field-error { color: var(--error); font-size: 12.5px; margin-top: 6px; min-height: 16px; font-weight: 500; }
  .checklist { list-style: none; margin: 12px 0 0; padding: 0; font-size: 13px; }
  .checklist li { padding: 3px 0; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .checklist li .mark {
    width: 16px; height: 16px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    font-size: 11px; font-weight: 700;
    background: var(--border); color: #fff;
  }
  .checklist li.met { color: var(--ok); }
  .checklist li.met .mark { background: var(--ok); }
  .checklist li.warn { color: var(--warn); }
  .checklist li.warn .mark { background: var(--warn); }
  button[type="submit"], .btn-primary {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 0;
    font-size: 15.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.15s, opacity 0.15s;
    text-decoration: none;
    display: block;
    text-align: center;
  }
  button[type="submit"]:hover:not(:disabled), .btn-primary:hover { background: #2449d6; }
  button[type="submit"]:disabled { opacity: 0.45; cursor: not-allowed; }
  .banner { border-radius: 10px; padding: 14px 16px; font-size: 14px; margin-bottom: 18px; text-align: left; line-height: 1.5; }
  .banner.error { background: var(--error-bg); color: var(--error); }
  .status-icon {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .status-icon.success { background: var(--ok-bg); }
  .status-icon.success svg { width: 30px; height: 30px; stroke: var(--ok); }
  .status-icon.warning { background: var(--error-bg); }
  .status-icon.warning svg { width: 30px; height: 30px; stroke: var(--error); }
  .back-link {
    display: inline-block;
    margin-top: 14px;
    color: var(--blue);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
  }
  .back-link:hover { text-decoration: underline; }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 480px) {
    .card { padding: 32px 22px; border-radius: 14px; }
  }
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/icon-48.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-180.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E1A3A">
</head>
<body>
  <div class="card" id="card">
    <div style="text-align:center;margin-bottom:18px"><img src="assets/curevona-logo.png?v=2" alt="Curevona" style="width:min(220px,70%);height:auto;object-fit:contain"></div>
    <h1 id="heading">Reset Your Password</h1>
    <p class="subtext" id="subtext">Create a new secure password for your account.</p>

    <div id="bannerBox"></div>

    <form id="resetForm" style="display:none" novalidate>
      <div class="field">
        <label for="newPw">New Password <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="password" id="newPw" required autocomplete="new-password" placeholder="Enter a new password" />
          <button type="button" class="toggle-visibility" data-target="newPw" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-error" id="newPwError"></div>
        <ul class="checklist" id="checklist">
          <li id="rule-length"><span class="mark">&middot;</span> At least 8 characters</li>
          <li id="rule-letter"><span class="mark">&middot;</span> At least 1 letter</li>
          <li id="rule-number"><span class="mark">&middot;</span> At least 1 number</li>
          <li id="rule-special"><span class="mark">&middot;</span> At least 1 special character</li>
        </ul>
      </div>

      <div class="field">
        <label for="confirmPw">Confirm New Password <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="password" id="confirmPw" required autocomplete="new-password" placeholder="Re-enter your new password" />
          <button type="button" class="toggle-visibility" data-target="confirmPw" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-error" id="confirmError"></div>
      </div>

      <button type="submit" id="submitBtn" disabled>Reset Password</button>
    </form>

    <div id="successBox" style="display:none">
      <a class="btn-primary" href="/" id="successCta">Go to Login</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjzfzvCXPCifxeG01QRJH6jT3Yh0VxFJk",
      authDomain: "curevona.firebaseapp.com",
      projectId: "curevona",
      storageBucket: "curevona.firebasestorage.app",
      messagingSenderId: "56185108381",
      appId: "1:56185108381:web:5563db3ef9573035762174",
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const CHECK_ICON = "\u2713";
    const WARN_ICON = "!";

    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get("oobCode");
    const heading = document.getElementById("heading");
    const subtext = document.getElementById("subtext");
    const form = document.getElementById("resetForm");
    const bannerBox = document.getElementById("bannerBox");
    const successBox = document.getElementById("successBox");
    const successCta = document.getElementById("successCta");
    const newPwEl = document.getElementById("newPw");
    const confirmPwEl = document.getElementById("confirmPw");
    const newPwError = document.getElementById("newPwError");
    const confirmError = document.getElementById("confirmError");
    const submitBtn = document.getElementById("submitBtn");

    let newPwTouched = false;
    let confirmTouched = false;

    function showBanner(text) {
      bannerBox.innerHTML = `<div class="banner error">${text}</div>`;
    }
    function clearBanner() {
      bannerBox.innerHTML = "";
    }

    // Show/hide password toggles
    document.querySelectorAll(".toggle-visibility").forEach((btn) => {
      btn.addEventListener("click", () => {
        const target = document.getElementById(btn.dataset.target);
        const isHidden = target.type === "password";
        target.type = isHidden ? "text" : "password";
        btn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
      });
    });

    const rules = {
      length: (pw) => pw.length >= 8,
      letter: (pw) => /[a-zA-Z]/.test(pw),
      number: (pw) => /[0-9]/.test(pw),
      special: (pw) => /[!@#$%^&*()_\-+=\[\]{}|\\:;"'<>,.?/~`]/.test(pw),
    };

    function passwordMeetsAllRules(pw) {
      return rules.length(pw) && rules.letter(pw) && rules.number(pw) && rules.special(pw);
    }

    // First unmet rule, in priority order - used for the field-level error message.
    function firstNewPasswordError(pw) {
      if (pw.length === 0) return "Password is required.";
      if (!rules.length(pw)) return "Password must contain at least 8 characters.";
      if (!rules.letter(pw)) return "Password must contain at least one letter.";
      if (!rules.number(pw)) return "Password must contain at least one number.";
      if (!rules.special(pw)) return "Password must contain at least one special character.";
      return "";
    }

    function updateChecklist(pw) {
      const started = pw.length > 0;
      for (const [key, test] of Object.entries(rules)) {
        const li = document.getElementById(`rule-${key}`);
        const met = test(pw);
        li.classList.toggle("met", met);
        li.classList.toggle("warn", started && !met);
        const mark = li.querySelector(".mark");
        mark.textContent = met ? CHECK_ICON : (started ? WARN_ICON : "\u00b7");
      }
    }

    function updateSubmitState() {
      const pw = newPwEl.value;
      const confirmPw = confirmPwEl.value;
      const pwValid = passwordMeetsAllRules(pw);

      newPwEl.classList.toggle("valid", pw.length > 0 && pwValid);
      newPwEl.classList.toggle("invalid", newPwTouched && pw.length > 0 && !pwValid);
      newPwError.textContent = newPwTouched ? firstNewPasswordError(pw) : "";

      let confirmOk = confirmPw.length > 0 && confirmPw === pw;
      confirmPwEl.classList.toggle("valid", confirmPw.length > 0 && confirmOk);
      confirmPwEl.classList.toggle("invalid", confirmTouched && confirmPw.length > 0 && !confirmOk);
      if (confirmTouched) {
        confirmError.textContent = confirmPw.length === 0 ? "Password is required." : (confirmOk ? "" : "Passwords do not match.");
      } else {
        confirmError.textContent = "";
      }

      submitBtn.disabled = !(pwValid && confirmOk);
    }

    newPwEl.addEventListener("input", () => {
      updateChecklist(newPwEl.value);
      updateSubmitState();
    });
    newPwEl.addEventListener("blur", () => { newPwTouched = true; updateSubmitState(); });
    confirmPwEl.addEventListener("input", updateSubmitState);
    confirmPwEl.addEventListener("blur", () => { confirmTouched = true; updateSubmitState(); });

    function friendlyResetError(err) {
      const code = err && err.code;
      if (code === "auth/expired-action-code" || code === "auth/invalid-action-code") {
        return "This password reset link is invalid or has expired.";
      }
      if (code === "auth/weak-password") {
        return "Please choose a stronger password and try again.";
      }
      if (code === "auth/network-request-failed") {
        return "Network error — please check your connection and try again.";
      }
      return "This password reset link is invalid or has expired.";
    }

    function showInvalidLinkScreen() {
      heading.textContent = "Link Expired or Invalid";
      subtext.textContent = "This password reset link is invalid or has expired.";
      const icon = document.createElement("div");
      icon.className = "status-icon warning";
      icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86l-8.18 14.18A2 2 0 0 0 3.9 21h16.2a2 2 0 0 0 1.79-2.96L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>';
      document.getElementById("card").insertBefore(icon, heading);
      successCta.textContent = "Request a new reset link";
      successCta.href = "/";
      successBox.style.display = "block";
    }

    if (!oobCode) {
      showInvalidLinkScreen();
    } else {
      verifyPasswordResetCode(auth, oobCode).then(() => {
        form.style.display = "block";
        updateChecklist("");
      }).catch(() => {
        showInvalidLinkScreen();
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearBanner();
      newPwTouched = true;
      confirmTouched = true;
      updateSubmitState();

      const newPw = newPwEl.value;
      const confirmPw = confirmPwEl.value;

      // Re-validate everything right before submission - never rely solely on
      // the live checklist/disabled-button state having gated this correctly.
      if (!passwordMeetsAllRules(newPw)) {
        showBanner(firstNewPasswordError(newPw));
        return;
      }
      if (newPw !== confirmPw) {
        showBanner("Passwords do not match.");
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.innerHTML = '<span class="spinner"></span>Resetting...';

      try {
        await confirmPasswordReset(auth, oobCode, newPw);
        // Never log the password or the reset code anywhere, including on success.
        form.style.display = "none";
        clearBanner();
        const icon = document.createElement("div");
        icon.className = "status-icon success";
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
        document.getElementById("card").insertBefore(icon, heading);
        heading.textContent = "Password reset successfully.";
        subtext.textContent = "You can now sign in using your new password.";
        successCta.textContent = "Go to Login";
        successCta.href = "/";
        successBox.style.display = "block";
      } catch (err) {
        showBanner(friendlyResetError(err));
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
        updateSubmitState();
      }
    });
  </script>
</body>
</html>
